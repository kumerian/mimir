name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: hermetic-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version-file: .python-version
      - name: Verify required-check failure propagation
        run: python3 scripts/test_required_check.py
      - name: Test local development installer
        run: python3 scripts/test_setup_dev.py
      - name: Test Windows setup bootstrap
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/test_setup_dev_windows.ps1
      - name: Validate candidate identity
        run: python3 scripts/required_check.py candidate-identity-tests -- python3 scripts/test_artifact_identity.py
      - name: Validate tool pins
        run: python3 scripts/required_check.py tool-pin-consistency -- python3 scripts/test_tool_pins.py
      - name: Check formatting
        run: python3 scripts/required_check.py formatting -- python3 scripts/check_format.py
      - name: Check module formatting
        run: python3 scripts/required_check.py module-tidy -- go mod tidy
      - name: Verify module checksums
        run: python3 scripts/required_check.py module-integrity -- go mod verify
      - name: Reject generated module changes
        run: python3 scripts/required_check.py module-cleanliness -- git diff --exit-code
      - name: Hermetic unit and contract tests
        run: python3 scripts/required_check.py hermetic-tests -- go test ./...
      - name: Go vet
        run: python3 scripts/required_check.py go-vet -- go vet ./...
      - name: Architecture dependency check
        run: python3 scripts/required_check.py architecture-boundaries -- python3 scripts/check_architecture.py
      - name: Architecture regression tests
        run: python3 scripts/required_check.py architecture-tests -- python3 scripts/test_architecture.py
      - name: Required task surface
        run: python3 scripts/required_check.py task-surface -- python3 scripts/check_tasks.py
      - name: Secret scan
        run: python3 scripts/required_check.py secret-scan -- python3 scripts/check_secrets.py
      - name: Documentation links
        run: python3 scripts/required_check.py docs-links -- python3 scripts/check_docs.py
      - name: OpenAPI endpoint contract
        run: python3 scripts/required_check.py openapi-contract -- python3 scripts/check_openapi.py
      - name: Metadata schema and compatibility fixtures
        run: python3 scripts/required_check.py metadata-schema -- python3 scripts/check_contracts.py
      - name: Metadata executable smoke
        run: python3 scripts/required_check.py metadata-smoke -- go run ./cmd/mimir validate --metadata contracts/examples/metadata-v1-draft.json
      - name: Clean install and local run smoke
        if: matrix.arch == 'amd64'
        run: python3 scripts/required_check.py clean-install-smoke -- python3 scripts/install_smoke.py
      - name: Build supported target
        shell: bash
        env:
          GOOS: ${{ matrix.os == 'ubuntu-24.04' && 'linux' || (matrix.os == 'macos-15' && 'darwin' || 'windows') }}
          GOARCH: ${{ matrix.arch }}
        run: python3 scripts/required_check.py cross-build -- go build -trimpath ./cmd/mimir
      - name: Explicit integration scope
        run: python3 scripts/required_check.py integration -- python3 scripts/run_tagged.py integration
      - name: Explicit acceptance scope
        run: python3 scripts/required_check.py acceptance -- python3 scripts/run_tagged.py acceptance

  candidate:
    name: candidate-build
    runs-on: ubuntu-24.04
    needs: [validate, security, race, mariadb-integration]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build candidate
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags="-buildid=" -o dist/mimir-candidate ./cmd/mimir
          sha256sum dist/mimir-candidate > dist/SHA256SUMS
          npm --prefix frontend ci
          npm --prefix frontend run test:unit
          npm --prefix frontend run build
          npx --prefix frontend playwright install chromium
          npm --prefix frontend run test:e2e
          cp -R frontend/dist/mimir/browser dist/gui
      - name: Record candidate identity
        run: |
          python3 scripts/required_check.py gui-candidate-identity-tests -- python3 scripts/test_gui_candidate_identity.py
          python3 scripts/required_check.py candidate-identity -- python3 scripts/gui_candidate_identity.py \
            --binary dist/mimir-candidate --frontend-dist dist/gui --output dist/gui-candidate-identity.json --require-clean
          sha256sum dist/gui-candidate-identity.json >> dist/SHA256SUMS
      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mimir-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  race:
    name: race-linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-enabled tests
        run: python3 scripts/required_check.py race-tests -- go test -race ./...

  security:
    name: dependency-vulnerability-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules and scan known vulnerabilities
        run: |
          python3 scripts/required_check.py module-integrity -- go mod verify
          python3 scripts/required_check.py vulnerability-scan -- go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  mariadb-integration:
    name: mariadb-repository-integration
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: metadata
          MARIADB_USER: mimir_test
          MARIADB_PASSWORD: ci-only-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test MariaDB metadata repository
        env:
          MIMIR_MARIADB_TEST_ADDRESS: 127.0.0.1:3306
          MIMIR_MARIADB_TEST_USER: mimir_test
          MIMIR_MARIADB_TEST_PASSWORD: ci-only-password
        run: go test -tags=integration ./internal/adapters/mariadb

  container:
    name: local-container-profile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend unit tests
        run: npm --prefix frontend run test:unit
      - name: Frontend browser verification
        run: |
          npx --prefix frontend playwright install chromium
          npm --prefix frontend run test:e2e
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build backend and Angular frontend images
        run: docker compose build
