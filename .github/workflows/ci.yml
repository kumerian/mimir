name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw --batch-mode --no-transfer-progress verify
        if: runner.os != 'Windows'
        working-directory: backend
      - run: ./mvnw.cmd --batch-mode --no-transfer-progress verify
        if: runner.os == 'Windows'
        working-directory: backend

  frontend-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  test-runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_runner.py -v
      - run: bash tests/test_prerequisites.sh
        shell: bash
      - run: ./tests/test_prerequisites_windows.ps1
        if: runner.os == 'Windows'

  docker-tests:
    needs: [backend-tests, frontend-tests, test-runner]
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: mimir-ci
      IMAGE_TAG: test
      DB_PASSWORD: ci-only-database-password
      DB_ROOT_PASSWORD: ci-only-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run complete test target
        run: make test

  build:
    needs: [backend-tests, frontend-tests, docker-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend, frontend, and MariaDB images after all tests pass
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_PASSWORD: build-only-placeholder
          DB_ROOT_PASSWORD: build-only-placeholder
        run: docker compose build
      - name: Export deployable images
        run: |
          docker save mimir-backend:${{ github.sha }} mimir-frontend:${{ github.sha }} mimir-database:${{ github.sha }} | gzip > mimir-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mimir-images-${{ github.sha }}
          path: mimir-images.tar.gz
          retention-days: 7
