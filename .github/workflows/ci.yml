name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  docker-tests:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: mimir-ci
      IMAGE_TAG: test
      DB_PASSWORD: ci-only-database-password
      DB_ROOT_PASSWORD: ci-only-root-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test images and start all three services
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Test the container stack
        run: python3 -m unittest discover -s tests/docker -v
      - name: Show diagnostics
        if: failure()
        run: docker compose ps --all && docker compose logs --no-color
      - name: Clean up test resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  build:
    needs: [backend-tests, frontend-tests, docker-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend, frontend, and MariaDB images after all tests pass
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_PASSWORD: build-only-placeholder
          DB_ROOT_PASSWORD: build-only-placeholder
        run: docker compose build
      - name: Export deployable images
        run: |
          docker save mimir-backend:${{ github.sha }} mimir-frontend:${{ github.sha }} mimir-database:${{ github.sha }} | gzip > mimir-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mimir-images-${{ github.sha }}
          path: mimir-images.tar.gz
          retention-days: 7
