name: Feature request
description: Suggest an idea to improve Mimir
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What use case is not currently supported?
      placeholder: Describe the pain point
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What should be added or changed?
      placeholder: Describe the proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Optional alternatives you have considered
      placeholder: List alternatives
