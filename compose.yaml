services:
  database:
    image: mimir-database:${IMAGE_TAG:-local}
    build:
      context: docker/mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-mimir}
      MARIADB_USER: ${DB_USER:-mimir}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
  backend:
    image: mimir-backend:${IMAGE_TAG:-local}
    build:
      context: backend
    environment:
      DB_URL: jdbc:mariadb://database:3306/${DB_NAME:-mimir}
      DB_USER: ${DB_USER:-mimir}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      database:
        condition: service_healthy
  frontend:
    image: mimir-frontend:${IMAGE_TAG:-local}
    build:
      context: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  database-data:
