services:
  database:
    image: mimir-database:${IMAGE_TAG:-local}
    build:
      context: docker/mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-mimir}
      MARIADB_USER: ${DB_USER:-mimir}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      LOADED_DB_NAME: ${LOADED_DB_NAME:-loaded_data}
      LOADED_DB_USER: ${LOADED_DB_USER:-mimir_loader}
      LOADED_DB_PASSWORD: ${LOADED_DB_PASSWORD:?Set LOADED_DB_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$LOADED_DB_PASSWORD" mariadb --user="$$LOADED_DB_USER" --database="$$LOADED_DB_NAME" --execute="SELECT 1" >/dev/null
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
  backend:
    image: mimir-backend:${IMAGE_TAG:-local}
    build:
      context: backend
    environment:
      DB_URL: jdbc:mariadb://database:3306/${DB_NAME:-mimir}
      DB_USER: ${DB_USER:-mimir}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      LOADED_DB_URL: jdbc:mariadb://database:3306/${LOADED_DB_NAME:-loaded_data}
      LOADED_DB_USER: ${LOADED_DB_USER:-mimir_loader}
      LOADED_DB_PASSWORD: ${LOADED_DB_PASSWORD:?Set LOADED_DB_PASSWORD in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      database:
        condition: service_healthy
  frontend:
    image: mimir-frontend:${IMAGE_TAG:-local}
    build:
      context: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  database-data:
