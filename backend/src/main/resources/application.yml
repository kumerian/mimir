spring:
  application:
    name: mimir
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/mimir}
    username: ${DB_USER:mimir}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
