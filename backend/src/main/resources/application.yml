spring:
  application:
    name: mimir
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/mimir}
    username: ${DB_USER:mimir}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
mimir:
  loaded-data:
    datasource:
      url: ${LOADED_DB_URL:jdbc:mariadb://localhost:3306/loaded_data}
      username: ${LOADED_DB_USER:mimir_loader}
      password: ${LOADED_DB_PASSWORD}
      hikari:
        connection-timeout: 5000
  logging:
    level: ${LOG_LEVEL:INFO}
logging:
  level:
    io.mimir: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger - %msg%n"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
